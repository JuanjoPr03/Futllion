<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futllion - Trivia de Rareza Futbolística</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>⚽ Futllion</h1>
            <p>¡20 segundos por pregunta! Demuestra tu nivel de nicho.</p>
            <div class="score-board">
                <span>Puntuación: <strong id="score">0</strong></span>
                <span id="timer-box">⏱️ <strong id="timer">20</strong>s</span>
                <span id="question-counter">Pregunta 1 de 2</span>
            </div>
        </header>

        <main class="game-card">
            <div class="question-box">
                <h2 id="question-title">Cargando pregunta...</h2>
                <p id="question-hint">Escribe tu respuesta antes de que se agote el tiempo.</p>
            </div>

            <div class="input-section">
                <input type="text" id="user-input" placeholder="Escribe un nombre..." autocomplete="off">
                <button id="submit-btn">Enviar</button>
            </div>

            <div id="feedback-message" class="feedback"></div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
